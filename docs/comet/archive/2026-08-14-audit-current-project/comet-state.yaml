acceptance:
  - id: A1
    source: brief.md
    text: "A1: 配置 DATABASE_URL=mysql+pymysql://... 后，历史存储使用 MySQL/InnoDB；未配置时本地
      SQLite 演示和现有单元测试仍可用。"
    result: passed
    reason:
      text: RunHistoryStore 支持 SQLite 回退和 mysql+pymysql；MySQL 方言、InnoDB 和 LONGTEXT
        元数据测试通过。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 使用相同 API 并发提交多个 run 时，每个请求都得到自己的 UUIDv4 结果，变量和案例结果不串线，单个 run
      内的依赖顺序保持不变。"
    result: passed
    reason:
      text: 两个真实 TestClient 线程交叠执行，UUID、变量/案例结果和依赖顺序互不串线。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 同时运行数达到配置上限（默认 4）时，后续 POST /api/v1/runs 在执行目标请求前返回 HTTP 429、错误码
      RUN_CAPACITY_EXCEEDED 和正整数 Retry-After。"
    result: passed
    reason:
      text: 容量满载测试返回 429、RUN_CAPACITY_EXCEEDED 和正整数 Retry-After，executor/store 均未调用。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: run 在成功、执行失败或历史保存异常时都会释放容量；释放后新的客户端可以进入，且不会因异常永久占用槽位。"
    result: passed
    reason:
      text: executor 异常和历史保存异常后，下一次运行均可获得容量槽并成功完成。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 多个并发完成的 run 写入历史后，列表无丢失、无重复、无损坏，仍按 created_at DESC, sequence DESC
      稳定排序；详情可读取完整安全结果。"
    result: passed
    reason:
      text: 20 路并发 SQLite 写入全部保留、无重复、可读取，并按 created_at/sequence 稳定排序。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: SQLite 和 MySQL 存储错误都映射为稳定的 503 历史错误，不向 API 返回驱动错误、凭据、绝对数据库路径或 SQL 细节。"
    result: passed
    reason:
      text: 损坏 SQLite、损坏 JSON 和历史 API 读写异常均转换为稳定错误，不暴露路径、SQL 或驱动细节。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 历史库只保存已脱敏的 TestRunResult 和摘要字段，不保存 base_url、请求头、查询参数、请求体或运行变量上下文。"
    result: passed
    reason:
      text: 持久化字节检查确认只写已脱敏 TestRunResult 和摘要，不写目标、请求数据或变量上下文。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 配置、依赖、数据库初始化/迁移说明和自动化测试覆盖本变更；不需要真实 MySQL 服务也能完成默认验证。"
    result: passed
    reason:
      text: pyproject、.env.example、README、契约和迁移边界已更新；218 tests passed，覆盖率 91.18%。
      truncated: false
  - id: A9
    source: specs/concurrent-history/spec.md
    text: SQLite fallback remains available Given DATABASE_URL is unset When a run
      is saved and then listed and loaded Then the result is stored in the
      repository-local SQLite database with the existing summary ordering and
      response shape.
    result: passed
    reason:
      text: 未配置数据库时使用仓库内 SQLite，WAL、初始化、读写和现有历史 API 回归通过。
      truncated: false
  - id: A10
    source: specs/concurrent-history/spec.md
    text: MySQL URL selects the MySQL dialect Given DATABASE_URL has the
      mysql+pymysql scheme When the history engine is created Then SQLAlchemy
      uses the MySQL dialect with an InnoDB-compatible table definition and does
      not expose the URL or credentials in storage errors.
    result: passed
    reason:
      text: MySQL DDL 编译确认 ENGINE=InnoDB、result_json LONGTEXT、sequence 主键和排序索引；未连接服务器。
      truncated: false
  - id: A11
    source: specs/concurrent-history/spec.md
    text: Concurrent runs are isolated Given multiple clients submit valid runs
      concurrently When each run completes Then each result has its own run id,
      variables and cases, and no result contains state from another run.
    result: passed
    reason:
      text: 并发 endpoint 测试确认两个客户端同时执行，历史记录和运行状态独立。
      truncated: false
  - id: A12
    source: specs/concurrent-history/spec.md
    text: Capacity is bounded Given all configured run slots are occupied When
      another valid run is submitted Then the request returns 429 with
      RUN_CAPACITY_EXCEEDED, a positive Retry-After, and no executor or
      persistence call.
    result: passed
    reason:
      text: 容量测试确认满载时在 executor 和 history store 前立即拒绝。
      truncated: false
  - id: A13
    source: specs/concurrent-history/spec.md
    text: Capacity is released after every terminal path Given a run finishes
      successfully, fails during execution, or fails while saving history When
      the next valid run is submitted Then the next run can acquire the slot and
      the prior terminal error remains sanitized and stable.
    result: passed
    reason:
      text: 成功、executor 失败、历史保存失败三类终止路径均验证容量释放。
      truncated: false
  - id: A14
    source: specs/concurrent-history/spec.md
    text: Concurrent history writes are consistent Given several completed results
      are saved at the same time When history is listed and individual details
      are loaded Then every retained result is complete, unique, readable, and
      ordered newest first.
    result: passed
    reason:
      text: 并发写入结果完整、唯一、可详情读取，列表排序稳定。
      truncated: false
  - id: A15
    source: specs/concurrent-history/spec.md
    text: The service keeps the existing synchronous request/response contract for
      one run while allowing independent client requests to execute at the same
      time.
    result: passed
    reason:
      text: endpoint 保持同步请求/响应模型，独立客户端可在线程中同时执行。
      truncated: false
  - id: A16
    source: specs/concurrent-history/spec.md
    text: DATABASE_URL is optional. With no value, the default SQLite database
      remains .data/run-history.sqlite3 and is restricted to the repository.
      With a mysql+pymysql URL, the store uses a MySQL InnoDB table with a
      stable sequence tie-breaker and a LONGTEXT/JSON-compatible result column.
    result: passed
    reason:
      text: DATABASE_URL 可选，SQLite 回退、MySQL/InnoDB、sequence tie-breaker 和 LONGTEXT
        均已验证。
      truncated: false
  - id: A17
    source: specs/concurrent-history/spec.md
    text: The storage interface exposes initialize(), save(result), list(limit), and
      get(run_id); callers do not depend on a database driver.
    result: passed
    reason:
      text: RunHistoryStore 保留 initialize/save/list/get 接口，调用方不依赖具体数据库驱动。
      truncated: false
  - id: A18
    source: specs/concurrent-history/spec.md
    text: The persisted payload is the already redacted TestRunResult. Request
      target, headers, query values, request body, run variables, credentials,
      and raw driver errors are never persisted or returned.
    result: passed
    reason:
      text: 脱敏结果持久化和错误响应测试确认目标、请求数据、变量上下文及原始错误不外泄。
      truncated: false
  - id: A19
    source: specs/concurrent-history/spec.md
    text: MAX_CONCURRENT_RUNS defaults to 4 and is a bounded positive setting. A
      request acquires one slot only after payload and target validation. If no
      slot is immediately available, the API returns 429 with detail code
      RUN_CAPACITY_EXCEEDED and a positive Retry-After header; it does not call
      the executor or history store.
    result: passed
    reason:
      text: MAX_CONCURRENT_RUNS 默认 4、范围 1–64；目标校验后获取槽位，满载立即拒绝且不排队。
      truncated: false
  - id: A20
    source: specs/concurrent-history/spec.md
    text: A slot is released in a finally block after execution and history save,
      including executor exceptions and persistence failures. There is no queue.
    result: passed
    reason:
      text: main.py 的 finally 覆盖执行和保存阶段，容量释放测试通过。
      truncated: false
  - id: A21
    source: specs/concurrent-history/spec.md
    text: Existing run-history routes and safe response fields remain compatible.
      The run executor remains sequential within a run, while independent HTTP
      client requests may overlap.
    result: passed
    reason:
      text: 既有历史 API、响应字段、前端契约和 executor 依赖串行回归测试全部通过。
      truncated: false
